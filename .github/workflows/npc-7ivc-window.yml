name: NPC 7iVC Window
on:
  push:
    paths:
      - '.github/workflows/npc-7ivc-window.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Trace 7iVC window
        env:
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
        run: python3 tools/npc_7ivc_window.py
      - name: Commit report
        run: |
          git config user.name "npc-trace-bot"
          git config user.email "actions@users.noreply.github.com"
          git add trace/npc_7ivc_window.json
          git commit -m "Add 7iVC NPC accumulation trace" || exit 0
          git pull --rebase
          git push
