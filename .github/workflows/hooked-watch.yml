name: HOOKED Watch

on:
  push:
    branches: ["main"]
    paths:
      - "monitor.py"
      - ".github/workflows/hooked-watch.yml"
      - "README.md"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: hooked-watch
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run HOOKED monitor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
        run: python monitor.py

      - name: Persist state and report
        run: |
          git config user.name "hooked-watch[bot]"
          git config user.email "hooked-watch[bot]@users.noreply.github.com"
          git add state reports
          if git diff --cached --quiet; then
            echo "No state changes to commit"
          else
            git commit -m "chore: update HOOKED watch state"
            git pull --rebase
            git push
          fi
