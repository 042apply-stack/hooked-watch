name: NPC Whale Origin
on:
  push:
    paths:
      - '.github/workflows/npc-origin.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  origin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Trace origin
        env:
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
        run: python3 tools/npc_origin.py
      - name: Commit report
        run: |
          git config user.name "npc-trace-bot"
          git config user.email "actions@users.noreply.github.com"
          git add trace/npc_origin.json
          git commit -m "Add NPC whale origin report" || exit 0
          git pull --rebase
          git push
