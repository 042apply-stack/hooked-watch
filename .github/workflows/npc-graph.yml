name: NPC Whale Graph
# rerun-v1: 2026-10-02
on:
  push:
    paths:
      - '.github/workflows/npc-graph.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  graph:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Trace graph
        env:
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
        run: python3 tools/npc_graph.py
      - name: Commit report
        run: |
          git config user.name "npc-trace-bot"
          git config user.email "actions@users.noreply.github.com"
          git add trace/npc_graph.json
          git commit -m "Add NPC whale graph report" || exit 0
          git pull --rebase
          git push
