name: NPC Recipient Trace
on:
  push:
    paths:
      - '.github/workflows/npc-recipients.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Trace recipients
        env:
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
        run: python3 tools/npc_recipients.py
